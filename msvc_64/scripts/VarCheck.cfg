
# file(MAKE_DIRECTORY <directories>... [RESULT <result>])¶


# QMS configuration check

# Load configuration files QMSUser.cfg and CfgGISInternals.cfg
# Get all defined non-system variables
# Carry out some existence check for files and directories
# Make a few consistency checks

# Call script from MSVC x64 Native Tools command prompt: cmake -PVarCheck.cfg

#IF(EXISTS "${dir}" AND IS_DIRECTORY "${dir}")
#if(EXISTS <path-to-file-or-directory>)
 
#https://cmake.org/cmake/help/latest/command/if.html
#https://cmake.org/cmake/help/latest/manual/cmake-commands.7.html
#https://cmake.org/cmake/help/latest/command/message.html

set(CMAKE_N "\n")

cmake_policy(SET CMP0011 NEW)

message(NOTICE "QMS configuration check ...${CMAKE_N}")

# https://cmake.org/cmake/help/latest/command/cmake_host_system_information.html:
#Query host system specific information
  
cmake_host_system_information(RESULT OS_NAME QUERY OS_NAME)
cmake_host_system_information(RESULT OS_RELEASE QUERY OS_RELEASE)
cmake_host_system_information(RESULT OS_VERSION QUERY OS_VERSION)
cmake_host_system_information(RESULT OS_PLATFORM QUERY OS_PLATFORM)

message(NOTICE "OS info:                ${OS_NAME}${OS_RELEASE}${OS_VERSION} on ${OS_PLATFORM} ")

#cmake_host_system_information(RESULT PROCESSOR_NAME QUERY PROCESSOR_NAME)
cmake_host_system_information(RESULT PROCESSOR_DESCRIPTION QUERY PROCESSOR_DESCRIPTION)
message(NOTICE "Processor info:         ${PROCESSOR_DESCRIPTION} ")


#Query Windows registry
#  cmake_host_system_information(RESULT <variable> QUERY WINDOWS_REGISTRY <key> ...)


file(STRINGS QMSUserCfg.dir USERDIR0 LIMIT_COUNT 1)
string(SUBSTRING ${USERDIR0} 11 -1 USERDIR)

set(QMSUSERCFG ${USERDIR}/${USERCFG})
message(NOTICE "User configuration:     ${QMSUSERCFG}")

# include configuration files:
include("${QMSUSERCFG}")


message(NOTICE "Used QMS version:       ${QMS_VERX}")

#string(SUBSTRING ${QT_VER} 0 1 QT)
message(NOTICE "Used QT major version:  Qt${QT}")


set(QMS_MSVC_DIR ".")

set(PKG "QMS")
include("CfgGISInternals.cfg")

set(PKG "QUAZIP")
include("CfgGISInternals.cfg")

# get all variables known to cmake
get_cmake_property(MY_VARS VARIABLES)

#message(NOTICE "${MY_VARS}")
#message(NOTICE "${CMAKE_BINARY_DIR}")
#message(NOTICE "cmake_root: ${CMAKE_ROOT}")

message(NOTICE "${CMAKE_N}Found variables with values:${CMAKE_N}")

# remove cmake system variables and show values of all user-defined varaibles:
foreach(I ${MY_VARS})

  string(SUBSTRING ${I} 0 5 K)
  if(NOT (${K} STREQUAL "CMAKE") )
    message(NOTICE "${I}: ${${I}}")
  endif()
endforeach()

message(NOTICE "${CMAKE_N}Consistency checks:${CMAKE_N}")

#message(NOTICE $ENV{VCTOOLSVERSION})
if($ENV{VCTOOLSVERSION} STREQUAL ${MSVC_VER})
  message(NOTICE "VCTOOLSVERSION ${MSVC_VER} correct.")
else()
  message(NOTICE "VCTOOLSVERSION ${MSVC_VER} wrong!")
endif()  

if(${CMAKE_ROOT} MATCHES ".+${MSVC_YEAR}")
  message(NOTICE "MSVC_YEAR ${MSVC_YEAR} correct.")
else()  
  message(NOTICE "MSVC ${MSVC_YEAR} wrong!")
endif()


set(DIRS
${MSYS2_DIR}
${GDAL_DEV_PATH}
${GISINTERNALS_DEV_PATH}
${JPEG_DEV_PATH}
${PROJ_DEV_PATH}
${PROJ_INCLUDE_DIR}
${QMSDIR}

${QUAZIP_DEV_PATH}
${QUAZIP_INCLUDE_DIR}

${QT_DIR}
${Qt${QT}_DIR}
${Qt${QT}Widgets_DIR}
${Qt${QT}Xml_DIR}
${Qt${QT}Sql_DIR}

${QuaZip-Qt${QT}_DIR}
${ROUTINO_DEV_PATH}
${ZLIB_INCLUDE_DIR}
${ZLIB_ROOT}
)

message(NOTICE "${CMAKE_N}Checking directories ...${CMAKE_N}")

foreach(I ${DIRS})
  #message(NOTICE ${I})
  set(RES "not found!")
  IF(EXISTS "${I}" AND IS_DIRECTORY "${I}")
    set(RES "exists.")
  endif()
  
  message(NOTICE "${I}: ${RES}")

endforeach()

set(FILES
${LIBPROJ_LIBRARY}
${ZLIB_LIBRARY}
${ZLIB_LIBRARY_RELEASE}
)

message(NOTICE "${CMAKE_N}Checking files ...${CMAKE_N}")

foreach(I ${FILES})
  #message(NOTICE ${I})
  set(RES "not found!")  
  IF(EXISTS "${I}")
    set(RES "exists.")
  endif()
  
  message(NOTICE "${I}: ${RES}")

endforeach()

message(NOTICE "${CMAKE_N}")