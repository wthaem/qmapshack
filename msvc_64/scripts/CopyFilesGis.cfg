message(NOTICE "  ${OUTFRH}${CMAKE_N}  ${OUTFQM}${CMAKE_N}  ${OUTFQU}${CMAKE_N}  ${OUTFGB}${CMAKE_N}  ./QMSUserCfg.dir")

# read commit info for further use
file(STRINGS QMSCommit.log myinfo REGEX "(Hash:)[ ]+([a-z0-9]+).+(Branches with same commit:)[^']+'([^']+)'" NEWLINE_CONSUME)

