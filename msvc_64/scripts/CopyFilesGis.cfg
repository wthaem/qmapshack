

# Run after running commit.py!

# Create patches to copyfiles.bat for QMS builds with gisinternals package
# Create built_routino_add.bat for compiling routino
# Create some other files

# Location of this script: typically `scripts` subdirectory

# Run on x64 Native tools command prompt: "cmake -DUSERDIR=myscripts -DUSERCFG=QMSUser_Test.cfg -PCopyFilesGis.cfg"
# -D parameters are optional and used to separate user-dependent from constant confiruation parts
#     -DUSERDIR:  relative path to user configuration file and newly generated files - sibling of path to this script. Must exist!
#     -DUSERCFG: filename with user configuration (without path)

# Example: d:\QtProjects\QMS\QMS4Qt6\msvc_64\scripts\>cmake -DUSERDIR=scripts_qms694 -DUSERCFG=QMSUser_test.cfg -PCopyFilesGis.cfg

#                                                     cmake -DUSERDIR=scripts_qt6    -DUSERCFG=QMSUser_qt6.cfg  -PCopyFilesGis.cfg

cmake_policy(SET CMP0007 NEW)
cmake_policy(SET CMP0011 NEW)
cmake_policy(SET CMP0159 NEW)


set(PKG QMS)

if(NOT DEFINED USERCFG)
    set(USERCFG "QMSUser.cfg")
endif()    

if(NOT DEFINED USERDIR)
    set(USERDIR scripts)
endif()

