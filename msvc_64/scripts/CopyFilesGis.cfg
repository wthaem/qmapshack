foreach(X ${VARS})
    string(REPLACE ${SL} ${BSL} H ${X})
    file(APPEND ${OUTF} "${H}" ${CMAKE_N})
endforeach()



set(VARIABLE_LISTS
    VARSX    ${OUTF}
    VARSR    ${OUTFR}
    VARSN    ${OUTFN}
    VARSRH   ${OUTFRH}
    VARSQM   ${OUTFQM}
    VARSQU   ${OUTFQU}
    VARSGB   ${OUTFGB}
)

list(LENGTH VARIABLE_LISTS _len)
math(EXPR _max "${_len} - 1")

foreach(i RANGE 0 ${_max} 2)

    #message(NOTICE "abc ${i}")
    math(EXPR j "${i} + 1")  # Get the next index
    #message(NOTICE "cde ${j}")

    list(GET VARIABLE_LISTS ${i} var_name)
    list(GET VARIABLE_LISTS ${j} out_file)

    foreach(X ${${var_name}})
        file(APPEND ${out_file} "${X}" ${CMAKE_N})
    endforeach()

endforeach()




message(NOTICE "End of run.${CMAKE_N}")