# Master list of triples - Collect all defined variables
collect_by_prefix(ALL_TRIPLES "TRIPLE_")

# -------------------------
# Process all triples

foreach(triple_var IN LISTS ALL_TRIPLES)

    # Expand triple definition
    set(triple ${${triple_var}})

    # Extract components
    list(GET triple 0 filename)
    list(GET triple 1 header)
    list(GET triple 2 list_var_name)

    # Write header
    file(WRITE "${USERDIR}/${filename}" "${header} ${CREATOR}")

    # Append list elements
    foreach(item IN LISTS ${list_var_name})
        set(H "${item}")
        string(REPLACE " /" "<SLASH>" H "${H}")
        string(REPLACE "${SL}" "${BSL}" H "${H}")
        string(REPLACE "<SLASH>" " /" H "${H}")
        string(REPLACE "<SLSH>" "/" H "${H}")
        string(REPLACE "<SEMICOLON>" ";" H "${H}")    
           
        file(APPEND "${USERDIR}/${filename}" "${H}\n")
    endforeach()

endforeach()


