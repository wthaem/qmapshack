# ---------------------------------------------------------------------

function(run_git output_var)
    execute_process(
        COMMAND git ${ARGN}
        OUTPUT_VARIABLE result
        OUTPUT_STRIP_TRAILING_WHITESPACE
        ERROR_VARIABLE error_output
        RESULT_VARIABLE rc
    )
    if(NOT rc EQUAL 0)
        message(FATAL_ERROR "Git command failed: git ${ARGN}\n${error_output}")
    endif()
    set(${output_var} "${result}" PARENT_SCOPE)
endfunction()

