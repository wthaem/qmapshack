# Macro definitions ---------------------------------------------------

macro(collect_by_prefix out_list prefix)

    # Make sure output list starts empty
    set(${out_list})

    # Get all variables in current scope
    get_cmake_property(_all_vars VARIABLES)

    foreach(var IN LISTS _all_vars)
        if(var MATCHES "^${prefix}")
            list(APPEND ${out_list} ${var})
        endif()
    endforeach()

endmacro()

macro(run_git_commands command_list)
    foreach(cmd_var IN LISTS ${command_list})

        # Expand the command list variable
        set(cmd_list ${${cmd_var}})

        # First element = output variable
        list(GET cmd_list 0 output_var)
        list(REMOVE_AT cmd_list 0)

        # Execute git
        run_git(${output_var} ${cmd_list})

    endforeach()
endmacro()

macro(run_git_group prefix)

    # Collect all variables in current scope
    collect_by_prefix(GIT_COMMANDS "${prefix}")    

    foreach(cmd_var IN LISTS GIT_COMMANDS)

        # Expand the command list
        set(cmd_list ${${cmd_var}})

        # First element = output variable
        list(GET cmd_list 0 output_var)
        list(REMOVE_AT cmd_list 0)

        run_git(${output_var} ${cmd_list})

    endforeach()
endmacro()

# Function definitions ------------------------------------------------

function(write_file_with_header FILENAME HEADER_LINE)
    file(WRITE "${FILENAME}" "${HEADER_LINE}\n")

    foreach(LINE IN LISTS ARGN)
        file(APPEND "${FILENAME}" "${LINE}\n")
    endforeach()
endfunction()

# ---------------------------------------------------------------------

function(run_git0 CMD_VAR OUTPUT_VAR)
    # CMD_VAR is the name of the list variable
    # message(STATUS "Running git command: ${${CMD_VAR}}")

    execute_process(
        COMMAND "${GIT_EXECUTABLE}" ${${CMD_VAR}}
        WORKING_DIRECTORY ${CMAKE_SOURCE_DIR}
        OUTPUT_VARIABLE RAW_OUTPUT
        ERROR_QUIET
        OUTPUT_STRIP_TRAILING_WHITESPACE
    )

    set(${OUTPUT_VAR} "${RAW_OUTPUT}" PARENT_SCOPE)
endfunction()

